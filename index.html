const toWorld = (c, y = 0.45) => new THREE.Vector3(c.x - HALF + 0.5, y, c.z - HALF + 0.5);

  Viper:   { base: 0x7048e8, dark: 0x1e1047, belly: 0xe5dbff, head: 0x845ef7, eye: 0xfcc419 },
  Coral:   { base: 0xe03131, dark: 0x111111, belly: 0xffe066, head: 0xc92a2a, eye: 0xffffff },
  Python:  { base: 0xb08850, dark: 0x3d2b14, belly: 0xf1e3c6, head: 0xa47a43, eye: 0xff922b },
  Ice:     { base: 0x1c7ed6, dark: 0x0b2a4a, belly: 0xd0ebff, head: 0x339af0, eye: 0xffffff },
  Toxic:   { base: 0x94d82d, dark: 0x2b3a0b, belly: 0xf4fce3, head: 0xa9e34b, eye: 0xff2d2d },
  Ember:   { base: 0xe8590c, dark: 0x3b1206, belly: 0xffe8cc, head: 0xf76707, eye: 0xa3e635 },

const PICKABLE = ['Emerald', 'Viper', 'Coral', 'Python', 'Ice', 'Toxic'];
const BOT_NAMES = ['Viper', 'Noodle', 'Slinky', 'Mamba', 'Zigzag', 'Fang', 'Scales', 'Twister', 'Boop', 'Rattler', 'Sidewinder', 'Wiggles', 'Dash', 'Shadow', 'Pretzel', 'Spike'];

// ---------- sound (tiny synth, no files) ----------
let actx = null, muted = store.get('sio21-muted', '0') === '1';
function tone(freq, freq2, dur, type = 'sine', vol = 0.08, delay = 0) {

    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0); o.frequency.exponentialRampToValueAtTime(freq2, t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);

const sfx = {
  eat: () => tone(520, 900, 0.09, 'triangle', 0.07),
  die: () => { tone(320, 50, 0.5, 'sawtooth', 0.06); tone(180, 40, 0.6, 'square', 0.03, 0.05); },
  kill: () => { tone(660, 660, 0.09, 'triangle', 0.08); tone(990, 990, 0.14, 'triangle', 0.08, 0.09); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.16, 'triangle', 0.08, i * 0.11)),
};
function setMuteLabel() { $('mute').textContent = muted ? '🔇 Muted' : '🔊 Sound'; }
setMuteLabel();

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 32, 70);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 250);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1e293b, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.7);
sun.position.set(8, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
scene.add(sun, sun.target);

// background stars
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(900 * 3);
for (let i = 0; i < 900; i++) {
  const r = 60 + Math.random() * 40, a = Math.random() * Math.PI * 2, h = (Math.random() - 0.3) * 60;
  starPos.set([Math.cos(a) * r, h, Math.sin(a) * r], i * 3);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x94a3b8, size: 0.3, fog: false }));
scene.add(stars);

// board (rebuilt when the board size changes)
const board = { tiles: null, walls: [] };
const tileGeo = new THREE.BoxGeometry(0.98, 0.2, 0.98), tileMat = new THREE.MeshStandardMaterial({ roughness: 0.9 });
const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5, emissive: 0x1d4ed8, emissiveIntensity: 0.18 });
function buildBoard(n) {
  if (board.tiles && N === n) return;
  if (board.tiles) { scene.remove(board.tiles); board.tiles.dispose(); }
  for (const w of board.walls) { scene.remove(w); w.geometry.dispose(); }
  N = n; HALF = n / 2;
  const tiles = new THREE.InstancedMesh(tileGeo, tileMat, n * n);
  const m4 = new THREE.Matrix4(), cA = new THREE.Color(0x1e293b), cB = new THREE.Color(0x24324a);
  for (let x = 0, i = 0; x < n; x++) for (let z = 0; z < n; z++, i++) {
    m4.setPosition(x - HALF + 0.5, -0.1, z - HALF + 0.5);
    tiles.setMatrixAt(i, m4);
    tiles.setColorAt(i, (x + z) % 2 ? cA : cB);
  }
  tiles.receiveShadow = true;
  scene.add(tiles);
  board.tiles = tiles;
  board.walls = [[n + 1, 0.5, 0, -HALF - 0.25], [n + 1, 0.5, 0, HALF + 0.25], [0.5, n + 1, -HALF - 0.25, 0], [0.5, n + 1, HALF + 0.25, 0]].map(([w, d, x, z]) => {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 0.8, d), wallMat);
    wall.position.set(x, 0.3, z);
    wall.castShadow = wall.receiveShadow = true;
    scene.add(wall);
    return wall;
  });

}
buildBoard(20);

const blackMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 });
const tongueMat = new THREE.MeshStandardMaterial({ color: 0xe11d48, roughness: 0.4 });

// ---------- snake model ----------
// The body is one continuous tube that follows a smooth curve through the cells.
// Its vertices are rebuilt every frame, so it bends, tapers, slithers and bulges.
const RADIAL = 16, PER_CELL = 5, MAX_CELLS = 402;
const MAX_RINGS = (MAX_CELLS - 1) * PER_CELL + 1;
const tubeIndex = (() => {
  const idx = new Uint32Array((MAX_RINGS - 1) * RADIAL * 6);
  let k = 0;
  for (let r = 0; r < MAX_RINGS - 1; r++) for (let j = 0; j < RADIAL; j++) {
    const a = r * (RADIAL + 1) + j, b = a + RADIAL + 1;
    idx.set([a, a + 1, b, b, a + 1, b + 1], k); k += 6;
  }
  return new THREE.BufferAttribute(idx, 1);
})();
const BODY_R = 0.36, FLAT = 0.8;

const headCache = {};
function headGeometry(skinName) {
  if (headCache[skinName]) return headCache[skinName];
  const sk = SKINS[skinName];
  const geo = new THREE.SphereGeometry(0.5, 36, 26);
  const pos = geo.attributes.position, cols = new Float32Array(pos.count * 3);
  const top = new THREE.Color(sk.head), belly = new THREE.Color(sk.belly), dark = new THREE.Color(sk.head).multiplyScalar(0.45), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const fwd = Math.max(0, z) / 0.5;
    x *= 0.95 * (1 - 0.4 * fwd);
    y *= 0.62 * (1 - 0.3 * fwd) * (y > 0 ? 0.88 : 1);
    z = z * 1.3 + 0.12;
    pos.setXYZ(i, x, y, z);
    c.copy(belly).lerp(top, smooth(-0.12, 0.04, y));
    const crown = smooth(0.08, 0.2, y) * (0.5 + 0.5 * Math.cos(z * 9)) * smooth(-0.4, 0.1, -Math.abs(x) * 2 + 0.3);

    cols.set([c.r, c.g, c.b], i * 3);

}
const eyeGeo = new THREE.SphereGeometry(0.105, 16, 12), pupilGeo = new THREE.SphereGeometry(0.06, 12, 10);
const browGeo = new THREE.SphereGeometry(0.12, 12, 8), nostrilGeo = new THREE.SphereGeometry(0.025, 8, 6);
const stemGeo = new THREE.BoxGeometry(0.035, 0.014, 0.3).translate(0, 0, 0.15), prongGeo = new THREE.BoxGeometry(0.022, 0.012, 0.13).translate(0, 0, 0.065);
const skullMat = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.38, clearcoat: 0.6, clearcoatRoughness: 0.3 });

function makeHead(skinName) {
  const sk = SKINS[skinName];
  const g = new THREE.Group();
  const skull = new THREE.Mesh(headGeometry(skinName), skullMat);
  skull.castShadow = true;
  g.add(skull);
  const eyeMat = new THREE.MeshPhysicalMaterial({ color: sk.eye, roughness: 0.1, clearcoat: 1, emissive: sk.eye, emissiveIntensity: 0.25 });
  const browMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(sk.head).multiplyScalar(0.8), roughness: 0.4, clearcoat: 0.5 });
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.position.set(0.33 * s, 0.1, 0.3);
    const pupil = new THREE.Mesh(pupilGeo, blackMat);
    pupil.scale.set(0.45, 1.5, 0.35);
    pupil.position.set(0.075 * s, 0, 0.02);
    eye.add(pupil);
    const brow = new THREE.Mesh(browGeo, browMat);
    brow.scale.set(1, 0.35, 1.2);
    brow.position.set(0.3 * s, 0.17, 0.3);
    const nostril = new THREE.Mesh(nostrilGeo, blackMat);
    nostril.position.set(0.07 * s, 0.07, 0.74);

  const tongue = new THREE.Group();
  tongue.position.set(0, -0.06, 0.72);
  tongue.add(new THREE.Mesh(stemGeo, tongueMat));

    const prong = new THREE.Mesh(prongGeo, tongueMat);
    prong.position.set(0, 0, 0.29);
    prong.rotation.y = 0.45 * s;
    tongue.add(prong);

const chunkGeo = new THREE.SphereGeometry(1, 12, 10);

class Snake {

    this.isAI = isAI;
    this.score = 0;
    this.kills = 0;
    this.acc = 0;
    this.boosting = false;
    this.boostSteps = 0;
    this.dead = false;
    this.deadAt = 0;
    this.bulges = [];
    this.pts = [];
    this.mistake = 0.02 + Math.random() * 0.06;

  get parts() { return [this.head, ...this.frags]; }
  radiusAt(s, len) {
    const u = s / Math.max(1, len - 1);

    for (let s = 0.5, i = 0; s < len - 0.5; s += stepS, i++) {
      const r = this.radiusAt(s, len);
      const m = new THREE.Mesh(chunkGeo, mats[i % 3 === 0 ? 1 : 0]);
      m.scale.set(r, r * FLAT, r);
      if (curve) curve.getPoint(s / (len - 1), m.position); else m.position.copy(toWorld(this.cells[Math.floor(s)]));
      m.castShadow = true;
      this.group.add(m);
      this.frags.push(m);
    }
    for (const p of this.parts) {
      p.userData.v = new THREE.Vector3((Math.random() - 0.5) * 8, Math.random() * 7 + 3, (Math.random() - 0.5) * 8);
      p.userData.spin = new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8);
    }
  }
  dispose() {
    scene.remove(this.group);
    this.geo.dispose(); this.mat.dispose();
    for (const m of this.headMats) m.dispose();
    for (const m of this.fragMats || []) m.dispose();
    this.label.remove();
  }
}

// ---------- food ----------
const appleGeo = new THREE.SphereGeometry(0.36, 24, 18);
const appleMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xb91c1c, emissiveIntensity: 0.9, roughness: 0.25 });
const appleStemGeo = new THREE.CylinderGeometry(0.03, 0.04, 0.2).translate(0, 0.4, 0);
const appleStemMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
const leafGeo = new THREE.SphereGeometry(0.12, 10, 6).scale(1.4, 0.3, 0.7).translate(0.13, 0.42, 0);
const leafMat = new THREE.MeshStandardMaterial({ color: 0x22c55e });
const ringGeo = new THREE.RingGeometry(0.35, 0.5, 32).rotateX(-Math.PI / 2);
const dropGeo = new THREE.SphereGeometry(0.2, 12, 10);
const dropMats = {};
let foods = [];
const foodMap = new Map();

function makeApple() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(appleGeo, appleMat);
  body.castShadow = true;
  g.add(body, new THREE.Mesh(appleStemGeo, appleStemMat), new THREE.Mesh(leafGeo, leafMat));
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.5, depthWrite: false }));
  scene.add(g, ring);
  return { kind: 'apple', group: g, ring, cell: null, born: 0 };
}
function makeDrop(cell, color, time) {
  if (foodMap.has(key(cell.x, cell.z))) return;
  const mat = dropMats[color] ||= new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.9 });
  const g = new THREE.Group();
  g.add(new THREE.Mesh(dropGeo, mat));
  scene.add(g);
  const f = { kind: 'drop', group: g, ring: null, cell, born: time };
  const p = toWorld(cell);
  g.position.set(p.x, 0.35, p.z);
  g.scale.setScalar(0.001);
  foods.push(f);
  foodMap.set(key(cell.x, cell.z), f);
  if (foods.length > 220) { const old = foods.find(x => x.kind === 'drop'); if (old) removeFood(old); }
}
function removeFood(f) {
  scene.remove(f.group); if (f.ring) { scene.remove(f.ring); f.ring.material.dispose(); }
  foods.splice(foods.indexOf(f), 1);
  if (f.cell && foodMap.get(key(f.cell.x, f.cell.z)) === f) foodMap.delete(key(f.cell.x, f.cell.z));
}
function occupied() {
  const s = new Set();
  for (const sn of snakes) if (!sn.dead) for (const c of sn.cells) s.add(key(c.x, c.z));
  for (const f of foods) if (f.cell) s.add(key(f.cell.x, f.cell.z));
  return s;
}
function placeFood(f, time) {
  const occ = occupied();
  let c, tries = 0;
  do c = { x: rand(N), z: rand(N) };
  while (occ.has(key(c.x, c.z)) && ++tries < 500);
  if (f.cell && foodMap.get(key(f.cell.x, f.cell.z)) === f) foodMap.delete(key(f.cell.x, f.cell.z));
  f.cell = c; f.born = time;
  foodMap.set(key(c.x, c.z), f);
  const p = toWorld(c);
  f.group.position.set(p.x, 0.55, p.z);
  f.ring.position.set(p.x, 0.02, p.z);
  f.group.scale.setScalar(0.001);
}

// ---------- particles ----------
const particles = [];
const partGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
const partMats = {};
function burst(pos, color, count = 16, power = 1) {
  const mat = partMats[color] ||= new THREE.MeshBasicMaterial({ color });
  for (let i = 0; i < count; i++) {
    const p = new THREE.Mesh(partGeo, mat);
    p.position.copy(pos);
    p.userData.v = new THREE.Vector3((Math.random() - 0.5) * 7 * power, (Math.random() * 5 + 2) * power, (Math.random() - 0.5) * 7 * power);
    p.userData.life = p.userData.max = 0.7 + Math.random() * 0.4;
    scene.add(p);
    particles.push(p);
  }
  while (particles.length > 400) scene.remove(particles.shift());
}

// ---------- game state ----------
let mode = 'arena', difficulty = 'normal';
let snakes = [], player = null;
let stepMs = 150, running = false, paused = false, gameId = 0, endShownAt = 0;
let chaseCam = false, shake = 0, nextBotCheck = 0, hudTimer = 0;
let playerSkin = store.get('sio21-skin', 'Emerald');
if (!PICKABLE.includes(playerSkin)) playerSkin = 'Emerald';
const nickEl = $('nick');
nickEl.value = store.get('sio21-nick', '');
const BOTS = 7, APPLES = 45, TARGET = 20;
const nick = () => (nickEl.value.trim() || 'You').slice(0, 14);

function clearWorld() {
  for (const s of snakes) s.dispose();
  for (const f of [...foods]) removeFood(f);
  snakes = []; player = null; foodMap.clear();
}

function spawnCells(len = 3) {
  const occ = occupied();
  const heads = snakes.filter(s => !s.dead).map(s => s.cells[0]);
  for (let tries = 0; tries < 400; tries++) {
    const dirIdx = rand(4), d = DIRS[dirIdx], m = Math.min(4, Math.floor(N / 5));
    const hx = m + rand(N - 2 * m), hz = m + rand(N - 2 * m);
    const cells = Array.from({ length: len }, (_, i) => ({ x: hx - d.x * i, z: hz - d.z * i }));
    if (cells.some(c => c.x < 0 || c.z < 0 || c.x >= N || c.z >= N || occ.has(key(c.x, c.z)))) continue;
    // keep the way ahead clear and stay away from other heads
    let ok = true;
    for (let k = 1; k <= 4 && ok; k++) if (occ.has(key(hx + d.x * k, hz + d.z * k))) ok = false;
    if (ok && heads.some(h => Math.abs(h.x - hx) + Math.abs(h.z - hz) < 7)) ok = tries > 300;
    if (ok) return { cells, dirIdx };
  }
  return null;
}

function spawnBot(time) {
  const sp = spawnCells();
  if (!sp) return;
  const used = new Set(snakes.filter(s => !s.dead).map(s => s.name));
  const names = BOT_NAMES.filter(n => !used.has(n));
  const skins = Object.keys(SKINS).filter(k => k !== playerSkin);
  const bot = new Snake({ skin: skins[rand(skins.length)], ...sp, isAI: true, name: names[rand(names.length)] || 'Bot' });
  bot.acc = -Math.random() * 100;
  snakes.push(bot);
}

function startGame(m) {
  mode = m;
  gameId++;
  store.set('sio21-nick', nickEl.value.trim());
  nickEl.blur();
  clearWorld();
  buildBoard(mode === 'arena' ? 40 : 20);
  const now = clock.elapsedTime;
  if (mode === 'arena') {
    const sp = spawnCells();
    player = new Snake({ skin: playerSkin, ...sp, isAI: false, name: nick() });
    snakes.push(player);
    for (let i = 0; i < BOTS; i++) spawnBot(now);
    for (let i = 0; i < APPLES; i++) { const f = makeApple(); foods.push(f); placeFood(f, now); }
  } else {
    const vs = mode === 'vs';
    player = new Snake({ skin: playerSkin, cells: vs ? [{ x: 6, z: 12 }, { x: 6, z: 13 }, { x: 6, z: 14 }] : [{ x: 10, z: 10 }, { x: 10, z: 11 }, { x: 10, z: 12 }], dirIdx: 0, isAI: false, name: nick() });
    snakes.push(player);
    if (vs) snakes.push(new Snake({ skin: playerSkin === 'Ember' ? 'Viper' : 'Ember', cells: [{ x: 13, z: 7 }, { x: 13, z: 6 }, { x: 13, z: 5 }], dirIdx: 2, isAI: true, name: 'Rival' }));
    for (let i = 0; i < (vs ? 2 : 1); i++) { const f = makeApple(); foods.push(f); placeFood(f, now); }
  }
  player.label.classList.add('me');
  stepMs = 150;
  running = true; paused = false;
  overlay.classList.add('hidden');
  boardEl.style.display = minimap.style.display = mode === 'arena' ? 'block' : 'none';
  $('boost').style.display = mode === 'arena' && matchMedia('(pointer: coarse)').matches ? 'block' : 'none';
  updateHud(); updateBoard();
}

// ---------- AI ----------
function inBounds(x, z) { return x >= 0 && z >= 0 && x < N && z < N; }
function flood(sx, sz, blocked, cap) {
  const seen = new Set([key(sx, sz)]), q = [[sx, sz]];
  let qi = 0;
  while (qi < q.length && seen.size < cap) {
    const [x, z] = q[qi++];
    for (const d of DIRS) {
      const nx = x + d.x, nz = z + d.z, k = key(nx, nz);
      if (!inBounds(nx, nz) || blocked.has(k) || seen.has(k)) continue;
      seen.add(k); q.push([nx, nz]);
    }
  }
  return seen.size;
}
function pathToFood(h, blocked, maxDepth) {
  const seen = new Set([key(h.x, h.z)]), q = [];
  for (let i = 0; i < 4; i++) {
    const nx = h.x + DIRS[i].x, nz = h.z + DIRS[i].z, k = key(nx, nz);
    if (!inBounds(nx, nz) || blocked.has(k)) continue;
    if (foodMap.has(k)) return { dir: i, dist: 1 };
    seen.add(k); q.push([nx, nz, i, 1]);
  }
  let qi = 0;
  while (qi < q.length) {
    const [x, z, first, dist] = q[qi++];
    if (dist >= maxDepth) continue;
    for (const d of DIRS) {
      const nx = x + d.x, nz = z + d.z, k = key(nx, nz);
      if (!inBounds(nx, nz) || blocked.has(k) || seen.has(k)) continue;
      if (foodMap.has(k)) return { dir: first, dist: dist + 1 };
      seen.add(k); q.push([nx, nz, first, dist + 1]);
    }
  }
  return { dir: -1, dist: Infinity };
}
function aiThink(ai) {
  const blocked = new Set(), danger = new Set();
  for (const s of snakes) {
    if (s.dead) continue;
    for (let i = 0; i < s.cells.length - 1; i++) blocked.add(key(s.cells[i].x, s.cells[i].z));
    if (s !== ai && !(mode === 'vs' && difficulty === 'easy')) for (const d of DIRS) danger.add(key(s.cells[0].x + d.x, s.cells[0].z + d.z));
  }
  const h = ai.cells[0];
  const options = [];
  for (let i = 0; i < 4; i++) {
    if ((i + 2) % 4 === ai.dirIdx) continue;
    const x = h.x + DIRS[i].x, z = h.z + DIRS[i].z;
    if (!inBounds(x, z) || blocked.has(key(x, z))) continue;
    options.push({ i, x, z, danger: danger.has(key(x, z)), space: flood(x, z, blocked, ai.cells.length * 2 + 12) });
  }
  ai.boosting = false;
  if (!options.length) return ai.dirIdx;
  const mistake = mode === 'arena' ? ai.mistake : { easy: 0.25, normal: 0.06, hard: 0 }[difficulty];
  if (Math.random() < mistake) return options[rand(options.length)].i;
  let pool = options.filter(o => !o.danger && o.space >= ai.cells.length);
  if (!pool.length) pool = options.filter(o => !o.danger);
  if (!pool.length) pool = options;
  const want = pathToFood(h, blocked, mode === 'arena' ? 30 : 400);
  const pick = pool.find(o => o.i === want.dir);
  if (pick) {
    if (mode === 'arena' && ai.cells.length > 9 && want.dist < 7 && Math.random() < 0.5) ai.boosting = true;
    return pick.i;
  }
  pool.sort((a, b) => b.space - a.space);
  // wander a little instead of always hugging the same direction
  if (pool.length > 1 && pool[1].space >= ai.cells.length * 2 && Math.random() < 0.15) return pool[1].i;
  return pool[0].i;
}

// ---------- movement ----------
const intervalFor = s => mode === 'arena' ? (s.boosting && s.cells.length > 4 ? 68 : 135) : stepMs;

function moveSnake(s, time) {
  if (s.isAI) s.dirIdx = aiThink(s);
  else if (s.queued.length) s.dirIdx = s.queued.shift();
  const d = DIRS[s.dirIdx];
  const head = { x: s.cells[0].x + d.x, z: s.cells[0].z + d.z };
  const hk = key(head.x, head.z);
  const food = foodMap.get(hk);

  if (!inBounds(head.x, head.z)) return die(s, null, time, 'hit the wall');
  for (let i = 0; i < s.cells.length - (food ? 0 : 1); i++) if (s.cells[i].x === head.x && s.cells[i].z === head.z) return die(s, null, time, 'bit your own tail');
  for (const o of snakes) {
    if (o === s || o.dead) continue;
    for (const c of o.cells) if (c.x === head.x && c.z === head.z) return die(s, o, time, 'ran into ' + o.name);
  }

  const old = s.cells.map(c => ({ ...c }));
  s.cells.unshift(head);
  if (food) eat(s, food, time);
  else s.cells.pop();
  if (s.boosting && mode === 'arena' && s.cells.length > 4) {
    s.boostSteps++;
    if (s.boostSteps % 6 === 0) { const t = s.cells.pop(); makeDrop(t, s.cBase.getHex(), time); }
  }
  s.prev = s.cells.map((_, i) => old[Math.min(i, old.length - 1)]);
}

function eat(s, f, time) {
  s.score++;
  s.bulges.push(0);
  burst(toWorld(f.cell, 0.6), f.kind === 'drop' ? 0xfde047 : (s === player ? 0xfacc15 : 0xfb923c), f.kind === 'drop' ? 6 : 14);
  if (s === player) sfx.eat();
  if (f.kind === 'apple') placeFood(f, time); else removeFood(f);
  if (mode !== 'arena') stepMs = Math.max(85, stepMs - 3);
  if (mode === 'vs' && s.score >= TARGET) finish(s === player ? 'win' : 'lose', s === player ? `You reached ${TARGET} apples first!` : `The rival reached ${TARGET} apples first.`);
}

function die(s, killer, time, how) {
  s.explode(time);
  burst(toWorld(s.cells[0], 0.6), s.cBase.getHex(), 30, 1.3);
  if (mode === 'arena') {
    const color = s.cBase.getHex();
    for (let i = 0; i < s.cells.length; i += s.cells.length > 40 ? 2 : 1) makeDrop(s.cells[i], color, time);
  }
  if (killer) {
    killer.kills++;
    if (killer === player) { toast(`You took out ${s.name}!`); sfx.kill(); }
  }
  const near = player && !player.dead && Math.abs(s.cells[0].x - player.cells[0].x) + Math.abs(s.cells[0].z - player.cells[0].z) < 12;
  if (s === player || near) { shake = s === player ? 0.9 : 0.35; sfx.die(); }
  if (s === player) {
    if (mode === 'solo') finish('over', `You ${how}. Score: ${s.score}`);
    else if (mode === 'vs') finish('lose', `You ${how}. The rival wins this one.`);
    else {
      const rank = 1 + snakes.filter(o => !o.dead && o.cells.length > s.cells.length).length;
      finish('over', `You ${how}. Length ${s.cells.length} · rank #${rank} · ${s.kills} kill${s.kills === 1 ? '' : 's'}`);
    }
  } else if (mode === 'vs') finish('win', `The rival ${how.replace('your own', 'its own').replace('ran into ' + player.name, 'ran into you')} — you win!`);
}

function finish(result, text) {
  if (!running) return;
  running = false;
  const id = gameId;
  const bestKey = 'sio21-best-' + mode;
  const value = mode === 'arena' ? player.cells.length : player.score;
  const best = Number(store.get(bestKey, 0));
  if (result !== 'lose' && mode !== 'vs' && value > best) { store.set(bestKey, value); text += ' — new best!'; }
  if (result === 'win') sfx.win();
  setTimeout(() => {
    if (id !== gameId) return;
    titleEl.textContent = { win: 'YOU WIN!', lose: 'YOU LOSE', over: mode === 'arena' ? 'YOU DIED' : 'GAME OVER' }[result];
    titleEl.className = result === 'win' ? 'win' : 'lose';
    msgEl.textContent = text;
    overlay.classList.remove('hidden');
    endShownAt = performance.now();
  }, 1300);
}

function togglePause() {
  if (!running) return;
  paused = !paused;
  titleEl.textContent = paused ? 'PAUSED' : ''; titleEl.className = 'neutral';
  msgEl.textContent = 'Press Space to keep going, or pick a mode to start over.';
  overlay.classList.toggle('hidden', !paused);
}

// ---------- HUD, leaderboard, labels, minimap ----------
let toastTimer = 0;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function updateHud() {
  if (!player) { hudEl.innerHTML = ''; return; }
  const cam = `<span>Cam: <b>${chaseCam ? 'Chase' : 'Top'}</b></span>`;
  if (mode === 'arena') {
    const alive = snakes.filter(s => !s.dead);
    const rank = 1 + alive.filter(s => s !== player && s.cells.length > player.cells.length).length;
    hudEl.innerHTML = `<span>Length: <b>${player.cells.length}</b></span><span>Rank: <b>#${rank}</b></span><span>Kills: <b>${player.kills}</b></span>${cam}`;
  } else if (mode === 'vs') {
    hudEl.innerHTML = `<span>You: <b>${player.score}</b></span><span>Rival: <b class="r">${snakes[1].score}</b></span>${cam}`;
  } else {
    hudEl.innerHTML = `<span>Score: <b>${player.score}</b></span><span>Best: <b>${store.get('sio21-best-solo', 0)}</b></span>${cam}`;
  }
}
function esc(t) { return t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function updateBoard() {
  if (mode !== 'arena') return;
  const list = snakes.filter(s => !s.dead || s === player).sort((a, b) => b.cells.length - a.cells.length).slice(0, 8);
  if (player && !list.includes(player)) list.push(player);
  boardEl.innerHTML = '<h3>LEADERBOARD</h3>' + list.map((s, i) => `<div class="${s === player ? 'me' : ''}"><span>${i + 1}. ${esc(s.name)}${s.dead ? ' ☠' : ''}</span><span>${s.cells.length}</span></div>`).join('');
}
const LV = new THREE.Vector3();
function updateLabels() {
  const show = mode !== 'solo';
  for (const s of snakes) {
    if (s.dead || !show) { s.label.style.display = 'none'; continue; }
    LV.copy(s.head.position); LV.y += 0.9;
    LV.project(camera);
    if (LV.z > 1 || Math.abs(LV.x) > 1.1 || Math.abs(LV.y) > 1.1) { s.label.style.display = 'none'; continue; }
    s.label.style.display = 'block';
    s.label.style.left = ((LV.x * 0.5 + 0.5) * innerWidth) + 'px';
    s.label.style.top = ((-LV.y * 0.5 + 0.5) * innerHeight) + 'px';
  }
}
function drawMinimap() {
  if (mode !== 'arena') return;
  const W = minimap.width, sc = W / N;
  mctx.clearRect(0, 0, W, W);
  mctx.fillStyle = 'rgba(30,41,59,0.6)'; mctx.fillRect(0, 0, W, W);
  mctx.fillStyle = '#f87171';
  for (const f of foods) if (f.kind === 'apple') mctx.fillRect(f.cell.x * sc + sc * 0.25, f.cell.z * sc + sc * 0.25, sc * 0.5, sc * 0.5);
  for (const s of snakes) {
    if (s.dead) continue;
    mctx.fillStyle = s === player ? '#fde047' : '#' + s.cBase.getHexString();
    for (const c of s.cells) mctx.fillRect(c.x * sc, c.z * sc, sc, sc);
  }
  if (player && !player.dead) {
    const h = player.cells[0];
    mctx.strokeStyle = '#fff'; mctx.lineWidth = 2;
    mctx.beginPath(); mctx.arc((h.x + 0.5) * sc, (h.z + 0.5) * sc, sc * 2.2, 0, Math.PI * 2); mctx.stroke();
  }
}

// ---------- input ----------
function steerAbs(i) {
  const last = player.queued.length ? player.queued[player.queued.length - 1] : player.dirIdx;
  if (i === last || (i + 2) % 4 === last) return;
  if (player.queued.length < 3) player.queued.push(i);
}
function turn(delta) {
  const last = player.queued.length ? player.queued[player.queued.length - 1] : player.dirIdx;
  if (player.queued.length < 3) player.queued.push((last + delta + 4) % 4);
}
const canSteer = () => running && !paused && player && !player.dead;

addEventListener('keydown', e => {
  if (e.target === nickEl) { if (e.key === 'Enter') startGame('arena'); return; }
  const k = e.key.toLowerCase();
  const map = { arrowup: 0, w: 0, arrowright: 1, d: 1, arrowdown: 2, s: 2, arrowleft: 3, a: 3 };
  if (k === ' ') {
    e.preventDefault();
    if (running) togglePause();
    else if (!overlay.classList.contains('hidden') && performance.now() - endShownAt > 300) startGame(mode);
    return;
  }
  if (k === 'c') { chaseCam = !chaseCam; updateHud(); return; }
  if (k === 'm') { muted = !muted; store.set('sio21-muted', muted ? '1' : '0'); setMuteLabel(); return; }
  if (k === 'shift') { if (canSteer()) player.boosting = true; return; }
  if (!(k in map)) return;
  e.preventDefault();
  if (!canSteer()) return;
  if (chaseCam) { if (map[k] === 1) turn(1); else if (map[k] === 3) turn(-1); }
  else steerAbs(map[k]);
});
addEventListener('keyup', e => { if (e.key === 'Shift' && player) player.boosting = false; });
addEventListener('blur', () => { if (player) player.boosting = false; });

let touch0 = null;
renderer.domElement.addEventListener('touchstart', e => { touch0 = e.touches[0]; }, { passive: true });
renderer.domElement.addEventListener('touchend', e => {
  if (!touch0 || !canSteer()) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.clientX, dy = t.clientY - touch0.clientY;
  touch0 = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
  if (chaseCam) { if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1); return; }
  steerAbs(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
});
const boostBtn = $('boost');
boostBtn.addEventListener('pointerdown', e => { e.preventDefault(); if (canSteer()) player.boosting = true; });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) boostBtn.addEventListener(ev, () => { if (player) player.boosting = false; });

$('arena').addEventListener('click', () => startGame('arena'));
$('solo').addEventListener('click', () => startGame('solo'));
$('versus').addEventListener('click', () => startGame('vs'));
$('mute').addEventListener('click', () => { muted = !muted; store.set('sio21-muted', muted ? '1' : '0'); setMuteLabel(); $('mute').blur(); });
document.querySelectorAll('.diff button').forEach(b => b.addEventListener('click', () => {
  difficulty = b.dataset.d;
  document.querySelectorAll('.diff button').forEach(x => x.classList.toggle('on', x === b));
}));
const skinsEl = $('skins');
for (const name of PICKABLE) {
  const sk = SKINS[name], b = document.createElement('button');
  const hex = n => '#' + n.toString(16).padStart(6, '0');
  b.title = name;
  b.style.background = `repeating-linear-gradient(135deg, ${hex(sk.base)} 0 7px, ${hex(sk.dark)} 7px 11px)`;
  b.classList.toggle('on', name === playerSkin);
  b.addEventListener('click', () => {
    playerSkin = name; store.set('sio21-skin', name);
    skinsEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
  skinsEl.appendChild(b);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- animation ----------
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
const P = new THREE.Vector3(), T = new THREE.Vector3(), SIDE = new THREE.Vector3(), COL = new THREE.Color();

function animateSnake(s, t, time, dt) {
  if (s.dead) {
    for (const p of s.parts) {
      const v = p.userData.v;
      v.y -= 18 * dt;
      p.position.addScaledVector(v, dt);
      if (p.position.y < 0.15 && v.y < 0) { p.position.y = 0.15; v.y *= -0.4; v.x *= 0.7; v.z *= 0.7; }
      p.rotation.x += p.userData.spin.x * dt; p.rotation.y += p.userData.spin.y * dt;
    }
    return;
  }
  const len = s.cells.length;
  const iv = intervalFor(s);
  s.bulges = s.bulges.map(b => b + dt * 1000 / iv * 1.4).filter(b => b < len + 1);

  const pts = s.pts;
  for (let i = 0; i < len; i++) {
    const a = toWorld(s.prev[i] || s.cells[i], 0), b = toWorld(s.cells[i], 0);
    const p = (pts[i] ||= new THREE.Vector3()).lerpVectors(a, b, t);
    if (i > 0) {
      const ahead = s.cells[i - 1], here = s.cells[i];
      const fx = ahead.x - here.x, fz = ahead.z - here.z;
      const w = Math.sin(time * (s.boosting ? 14 : 8) - i * 0.85) * 0.1 * Math.min(1, i / 2.5);
      p.x += -fz * w; p.z += fx * w;
    }
  }
  pts.length = len;
  const curve = s.curve = new THREE.CatmullRomCurve3(pts.slice(0, len), false, 'catmullrom', 0.5);

  const rings = (len - 1) * PER_CELL + 1;
  const pos = s.geo.attributes.position.array, nor = s.geo.attributes.normal.array, col = s.geo.attributes.color.array;
  const glow = s.boosting ? 0.25 + 0.15 * Math.sin(time * 25) : 0;
  let v = 0;
  for (let r = 0; r < rings; r++) {
    const u = r / (rings - 1), sc = u * (len - 1);
    curve.getPoint(u, P);
    curve.getTangent(u, T);
    SIDE.set(T.z, 0, -T.x).normalize();
    const rad = s.radiusAt(sc, len);
    const cy = rad * FLAT + 0.02;
    const band = Math.pow(0.5 + 0.5 * Math.cos(sc * Math.PI * 2), 3);
    const zig = 0.5 + 0.5 * Math.cos(sc * Math.PI * 4 + 1);
    for (let j = 0; j <= RADIAL; j++) {
      const th = j / RADIAL * Math.PI * 2, c = Math.cos(th), sn = Math.sin(th);
      pos[v] = P.x + SIDE.x * c * rad;
      pos[v + 1] = cy + sn * rad * FLAT;
      pos[v + 2] = P.z + SIDE.z * c * rad;
      const nx = SIDE.x * c, ny = sn / FLAT, nz = SIDE.z * c, nl = Math.hypot(nx, ny, nz);
      nor[v] = nx / nl; nor[v + 1] = ny / nl; nor[v + 2] = nz / nl;
      COL.copy(s.cBase);
      COL.lerp(s.cDark, band * smooth(0.15, 0.85, sn) * 0.85);
      COL.lerp(s.cDark, smooth(0.55, 0.05, Math.abs(sn)) * smooth(0.55, 0.85, zig) * 0.6);
      COL.multiplyScalar(0.92 + 0.08 * Math.cos(j * 2.4 + sc * 18) + glow);
      COL.lerp(s.cBelly, smooth(-0.15, -0.55, sn));
      col[v] = COL.r; col[v + 1] = COL.g; col[v + 2] = COL.b;
      v += 3;
    }
  }
  s.geo.setDrawRange(0, (rings - 1) * RADIAL * 6);
  s.geo.attributes.position.needsUpdate = s.geo.attributes.normal.needsUpdate = s.geo.attributes.color.needsUpdate = true;

  const target = Math.atan2(DIRS[s.dirIdx].x, DIRS[s.dirIdx].z);
  s.yaw += Math.atan2(Math.sin(target - s.yaw), Math.cos(target - s.yaw)) * Math.min(1, dt * 14);
  s.head.position.set(pts[0].x, 0.33 + Math.sin(time * 8) * 0.025, pts[0].z);
  s.head.rotation.set(Math.sin(time * 4) * 0.04, s.yaw + Math.sin(time * 8) * 0.06, 0);
  const gulp = s.bulges.length && s.bulges[s.bulges.length - 1] < 0.8 ? 0.12 : 0;
  s.head.scale.setScalar(1 + gulp);
  const flick = Math.pow(Math.max(0, Math.sin(time * 5 + s.name.length)), 10);
  s.tongue.scale.set(1, 1, 0.01 + flick);
  s.tongue.rotation.x = Math.sin(time * 40) * 0.15 * flick;
}

const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 40, 38), camLook = new THREE.Vector3();
let idleAngle = 0;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.elapsedTime;

  if (running && !paused) {
    for (const s of [...snakes]) {
      if (s.dead) continue;
      s.acc += dt * 1000;
      let iv;
      while (running && !s.dead && s.acc >= (iv = intervalFor(s))) { s.acc -= iv; moveSnake(s, time); }
    }
  }
  if (mode === 'arena' && player && time > nextBotCheck) {
    nextBotCheck = time + 0.5;
    // clear away old wreckage and bring in new bots
    for (const s of [...snakes]) if (s.dead && s !== player && time - s.deadAt > 2.5) { s.dispose(); snakes.splice(snakes.indexOf(s), 1); }
    const alive = snakes.filter(s => s.isAI && !s.dead).length;
    const recent = snakes.some(s => s.isAI && s.dead);
    if (alive < BOTS && !recent) spawnBot(time);
  }
  for (const s of snakes) animateSnake(s, s.dead ? 1 : Math.min(1, Math.max(0, s.acc) / intervalFor(s)), time, dt);

  for (const f of foods) {
    const age = time - f.born;
    f.group.scale.setScalar(Math.max(0.001, elasticOut(age / 0.6)));
    if (f.kind === 'apple') {
      f.group.position.y = 0.55 + Math.sin(time * 3 + f.cell.x) * 0.12;
      f.group.rotation.y += dt * 1.5;
      const pulse = (time * 0.8 + f.cell.z * 0.1) % 1;
      f.ring.scale.setScalar(0.6 + pulse * 1.4);
      f.ring.material.opacity = 0.6 * (1 - pulse);
    } else {
      f.group.position.y = 0.3 + Math.sin(time * 4 + f.cell.x + f.cell.z) * 0.06;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.v.y -= 12 * dt;
    p.position.addScaledVector(p.userData.v, dt);
    p.rotation.x += dt * 6;
    p.userData.life -= dt;
    p.scale.setScalar(Math.max(0.01, p.userData.life / p.userData.max));
    if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
  }
  stars.rotation.y += dt * 0.01;

  // camera
  if (player && !player.dead) {
    const head = player.head.position;
    if (chaseCam) {
      tmpA.set(-Math.sin(player.yaw) * 6, 5, -Math.cos(player.yaw) * 6).add(head);
      tmpB.set(Math.sin(player.yaw) * 4, 0, Math.cos(player.yaw) * 4).add(head);
    } else if (mode === 'arena') {
      tmpA.set(head.x, 19 + Math.min(10, player.cells.length * 0.12), head.z + 13);
      tmpB.copy(head);
    } else {
      tmpA.set(head.x * 0.3, 22, 15 + head.z * 0.3);
      tmpB.set(head.x * 0.3, 0, head.z * 0.3);
    }
    sun.position.set(head.x + 8, 20, head.z + 10);
    sun.target.position.set(head.x, 0, head.z);
  } else if (!player) {
    idleAngle += dt * 0.15;
    tmpA.set(Math.sin(idleAngle) * 24, 18, Math.cos(idleAngle) * 24);
    tmpB.set(0, 0, 0);
  }
  camPos.lerp(tmpA, Math.min(1, dt * 3));
  camLook.lerp(tmpB, Math.min(1, dt * 4));
  camera.position.copy(camPos);
  if (shake > 0.01) {
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake;
    shake *= Math.exp(-dt * 4);
  }
  camera.lookAt(camLook);

  hudTimer -= dt;
  if (hudTimer <= 0) { hudTimer = 0.2; updateHud(); updateBoard(); drawMinimap(); }
  updateLabels();

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

frame();
</script>

</script>
